version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      shm_size: '1gb'
    shm_size: '1gb'
    tty: true
    stdin_open: true
    ports:
      - "3002:5173"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - TZ=America/Sao_Paulo
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - canal_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - PORT=3001
      - TZ=America/Sao_Paulo
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=canal_db
      # Oracle envs (Winthor)
      - ORACLE_USER=${ORACLE_USER}
      - ORACLE_PASS=${ORACLE_PASS}
      - ORACLE_CONN_STR=${ORACLE_CONN_STR}
      - LOCATIONIQ_API_KEY=${LOCATIONIQ_API_KEY}
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}
      - TAILSCALE_AUTH_KEY=${TAILSCALE_AUTH_KEY}
      # Diretório de imagens dos produtos
      - IMAGES_DIR=/app/imagens_produtos
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Diretório real de imagens no host
      - ${HOST_IMAGES_DIR:-/mnt/fotos_prod}:/app/imagens_produtos 
      # Pastas para o BOT SAC
      - /mnt/danfe_boletos:/app/danfe_boletos
      - /mnt/SAC:/app/SAC
      # Persistência do estado do Tailscale
      - tailscale_data:/var/lib/tailscale
    depends_on:
      - db
    networks:
      - canal_network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=canal_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - canal_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node src/worker.js
    environment:
      - NODE_ENV=development
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - TZ=America/Sao_Paulo
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=canal_db
      # Oracle envs (Winthor)
      - ORACLE_USER=${ORACLE_USER}
      - ORACLE_PASS=${ORACLE_PASS}
      - ORACLE_CONN_STR=${ORACLE_CONN_STR}
      - LOCATIONIQ_API_KEY=${LOCATIONIQ_API_KEY}
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}
      # Diretório de imagens dos produtos
      - IMAGES_DIR=/app/imagens_produtos
      # URL pública do backend acessível externamente (para Evolution API baixar PDFs)
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-http://backend:3001}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ${HOST_IMAGES_DIR:-/mnt/fotos_prod}:/app/imagens_produtos
      # Pastas para o BOT SAC
      - /mnt/danfe_boletos:/app/danfe_boletos
      - /mnt/SAC:/app/SAC
    depends_on:
      - db
      - backend
    networks:
      - canal_network

volumes:
  pgdata:
  tailscale_data:

networks:
  canal_network:
    driver: bridge
